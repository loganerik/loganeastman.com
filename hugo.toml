baseURL = "https://loganeastman.com/"
languageCode = "en-us"
title = "TRYHARD"
enableRobotsTXT = true
timeZone = "America/Los_Angeles"

[params]
  tagline = "in a whytry world"
  author = "Logan Eastman"
  description = "TRYHARD in a whytry world. Columns by Logan Eastman."
  ogImage = "/tryhard/og.jpg"

[taxonomies]
  tag = "tags"
  category = "categories"

[permalinks]
  [permalinks.page]
    columns = "/columns/:slug/"

[menus]
  [[menus.main]]
    name = "Today"
    url = "/"
    weight = 1
  [[menus.main]]
    name = "Archive"
    url = "/archive/"
    weight = 2
  [[menus.main]]
    name = "Explore"
    url = "/explore/"
    weight = 3
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 4

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    noClasses = false

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[pagination]
  pagerSize = 50

[imaging]
  quality = 85
  resampleFilter = "Lanczos"
