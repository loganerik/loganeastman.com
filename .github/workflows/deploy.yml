name: Build and deploy

on:
  push:
    branches: [main]
    paths-ignore: ['archive/**', '**.md']
  repository_dispatch:
    types: [vault-updated]
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *'   # daily: Horizon dates roll over

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check out the vault
        uses: actions/checkout@v4
        with:
          repository: loganerik/vault
          ssh-key: ${{ secrets.VAULT_DEPLOY_KEY }}
          path: vault
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build site
        run: npm run build --workspace site
        env:
          VAULT_PATH: ../vault
          BUILD_ID: ${{ github.sha }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker + assets
        run: npx wrangler deploy --var BUILD_ID:${{ github.sha }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
