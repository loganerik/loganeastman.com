name: Build and deploy

on:
  push:
    branches: [main]
    paths-ignore: ['archive/**', '**.md']
  repository_dispatch:
    types: [vault-updated]
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *'   # daily: Horizon dates roll over

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check vault token
        run: |
          echo "token length: ${#T}"
          echo "api status: $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $T" https://api.github.com/repos/loganerik/vault)"
          echo "token prefix ok: $([[ "$T" == github_pat_* ]] && echo yes || echo no)"
        env:
          T: ${{ secrets.VAULT_READ_TOKEN }}

      - name: Check out the vault
        uses: actions/checkout@v4
        with:
          repository: loganerik/vault
          token: ${{ secrets.VAULT_READ_TOKEN }}
          path: vault
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Build site
        run: npm run build --workspace site
        env:
          VAULT_PATH: ../vault
          BUILD_ID: ${{ github.sha }}

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker + assets
        run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
