<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
<head>
{{ partial "tryhard/head.html" . }}
</head>
<body class="th-site{{ with .Params.bodyClass }} {{ . }}{{ end }}">
  <a class="th-skip" href="#main">Skip to the writing</a>
  {{ partial "tryhard/masthead.html" . }}
  <main class="th-main{{ if .IsHome }} th-main--home{{ end }}{{ if and .IsPage (eq .Section "columns") }} th-main--column{{ end }}" id="main">{{ block "main" . }}{{ end }}</main>
  {{ partial "tryhard/footer.html" . }}
</body>
</html>
