{{ define "main" }}
{{ $kind := .Data.Plural }}
<div class="th-explore-head th-post-head"><p>{{ if eq $kind "categories" }}Broad territories the columns keep returning to.{{ else }}Smaller threads that run through the writing.{{ end }}</p></div>
<section class="th-explore-block {{ if eq $kind "tags" }}th-explore-block--tags{{ end }}">
  <div class="th-section-topline"><h2>All {{ $kind }}</h2><a href="/explore/">Explore ↗</a></div>
  {{ partial "tryhard/term-list.html" (dict "Kind" $kind) }}
</section>
{{ end }}
