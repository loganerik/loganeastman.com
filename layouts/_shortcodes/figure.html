{{- /* {{< figure src="photo.jpg" alt="..." caption="..." duotone="true" >}} */ -}}
{{- $src := .Get "src" -}}
{{- $r := .Page.Resources.GetMatch $src -}}
{{- $duo := eq (.Get "duotone" | default "false") "true" -}}
<figure class="th-figure{{ if .Get "class" }} {{ .Get "class" }}{{ end }}">
  {{- with $r -}}
    {{- $large := .Resize "1400x webp q85" -}}{{- $small := .Resize "800x webp q85" -}}
    <img class="{{ if $duo }}th-duotone{{ end }}" src="{{ $large.RelPermalink }}" srcset="{{ $small.RelPermalink }} 800w, {{ $large.RelPermalink }} {{ $large.Width }}w" sizes="(max-width: 900px) 100vw, 760px" alt="{{ $.Get "alt" }}" width="{{ $large.Width }}" height="{{ $large.Height }}" loading="lazy">
  {{- else -}}
    <img class="{{ if $duo }}th-duotone{{ end }}" src="{{ $src }}" alt="{{ $.Get "alt" }}" loading="lazy">
  {{- end -}}
  {{ with .Get "caption" }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>
