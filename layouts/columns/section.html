{{ define "main" }}
{{ with .Description }}<div class="th-explore-head th-post-head"><p>{{ . }}</p></div>{{ end }}
<section class="th-explore-block">
  <div class="th-section-topline"><h2>By date</h2><a href="/explore/">Explore topics ↗</a></div>
  {{ with .RegularPages.ByDate.Reverse }}
  <div class="th-archive-list">{{ range . }}{{ partial "tryhard/archive-row.html" . }}{{ end }}</div>
  {{ else }}<p class="th-muted">The first edition has yet to be published.</p>{{ end }}
</section>
{{ end }}
