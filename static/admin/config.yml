# Decap CMS for TRYHARD. Sign-in is GitHub OAuth, brokered by the Cloudflare
# Pages functions in /functions/api (needs GITHUB_CLIENT_ID and
# GITHUB_CLIENT_SECRET set in the Pages project's environment variables).
backend:
  name: github
  repo: loganerik/loganeastman.com
  branch: main
  base_url: https://loganeastman.com
  auth_endpoint: api/auth
  commit_messages:
    create: "Column: {{slug}}"
    update: "Column: update {{slug}}"
    delete: "Column: remove {{slug}}"
    uploadMedia: "Media: {{path}}"
    deleteMedia: "Media: remove {{path}}"

publish_mode: editorial_workflow
site_url: https://loganeastman.com
display_url: https://loganeastman.com
logo_url: https://loganeastman.com/tryhard/og.jpg
locale: en

# Images live next to each column (page bundle), so Hugo can resize them.
media_folder: content/columns
public_folder: ""

collections:
  - name: columns
    label: Columns
    label_singular: Column
    folder: content/columns
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    create: true
    slug: "{{slug}}"
    preview_path: "columns/{{slug}}/"
    summary: "{{title}} — {{date | date('ddd, MMM D, YYYY')}}"
    sortable_fields: [date, title]
    editor:
      preview: true
    fields:
      - label: Title
        name: title
        widget: string
        hint: "The column headline. The page supplies the main heading, so start Body sections with Heading 2 (##)."
      - label: Date
        name: date
        widget: datetime
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "YYYY-MM-DD"
        time_format: "HH:mm"
        picker_utc: false
        hint: "Publication date and time, used for the archive and weekly lineup. The picker uses your device's local time; the site displays Los Angeles time. Future-dated columns appear only after that time and the next site update."
      - label: Description
        name: description
        widget: string
        required: false
        hint: "Optional plain-text standfirst under the headline and in link previews. On the homepage, leaving this blank uses the first prose paragraph as an excerpt."
      - label: Draft
        name: draft
        widget: boolean
        default: true
        hint: "Keep on while writing. To make the column public, switch off and use Publish. The public site updates after its build finishes."
      - label: Categories
        name: categories
        widget: taglist
        required: false
        hint: "Broad subjects, such as Culture or Urban Life. Separate with commas; spaces inside a name are fine. Reuse the same spelling to group columns together in Explore."
      - label: Tags
        name: tags
        widget: taglist
        required: false
        hint: "More specific recurring ideas, such as attention or Highland Park. Separate with commas; spaces inside a tag are fine. Matching tags link columns together."
      - label: Cover
        name: cover
        widget: object
        required: false
        collapsed: true
        hint: "Optional. Pattern and Accent style this column's card on the homepage and archive whether or not it has a photo; left blank, each column automatically gets a different pattern and palette from the one before it. Image adds a featured photo. Open Writing guide for examples."
        fields:
          - label: Pattern
            name: style
            widget: select
            required: false
            options: [lines, waves, steps, rays, arches, scallops]
            hint: "Generated cover motif: stripes, waves, stepped buildings, sun rays, arches, or overlapping scallops. Leave blank for an automatic choice."
          - label: Accent
            name: accent
            widget: select
            required: false
            options: [sage, rose, jade, brown, olive]
            hint: "Color palette: sage, rose, jade, brown or olive. It colours the generated cover, the band at the foot of a photo cover, and the tone of any duotone picture in this column. Leave blank for an automatic choice."
          - label: Image
            name: image
            widget: image
            required: false
            hint: "Optional. Leave blank and the first picture in the Body, wherever it sits, becomes the cover automatically. Or pick any JPG, PNG, or WebP beside this column to choose a different one. Either way it is cropped into the Deco cover shape for the homepage, weekly strip, archive and sharing, shown in black and white with the column's Accent band and pattern fading in at its foot."
          - label: Alt text
            name: alt
            widget: string
            required: false
            hint: "Describe the photo's meaningful content for readers who cannot see it. This is separate from the visible caption; avoid filenames or 'image of'."
          - label: Caption
            name: caption
            widget: string
            required: false
            hint: "Visible note or photo credit below the featured image. Markdown links and emphasis are supported, for example Photo by [Name](https://example.com)."
          - label: Duotone
            name: duotone
            widget: boolean
            required: false
            default: false
            hint: "Covers are black and white by default. Duotone tints the cover and every picture in this column (featured photo, Figures, and plain images in the Body) in the column's Accent colour (green by default; rose, jade, brown or olive when Accent is set). A Figure block can still turn duotone on or off for one picture."
          - label: Show at top of column
            name: hero
            widget: boolean
            required: false
            default: true
            hint: "On: the image opens the column in a gold frame. Off: it is used only as the cover on listings and for sharing, so you can place it anywhere in the body as a Figure instead."
          - label: Crop focus
            name: focus
            widget: select
            required: false
            default: smart
            options: [smart, center, top, bottom, left, right]
            hint: "Which part of the photo to keep when it is cropped to the cover shape. Smart finds the subject; choose top for faces near the top, and so on."
      - label: Body
        name: body
        widget: markdown
        modes: [rich_text, raw]
        editor_components: [image, code-block, pullquote, aside, ornament, diamond, figure]
        hint: "Rich Text: select text to format it; use + for images, code, Pull quote, Aside, Sunburst divider, Diamond divider, and Figure. Markdown: use ## / ### for sections and paste the examples in Writing guide. Put special blocks on their own lines with a blank line on each side."

  - name: pages
    label: Pages
    files:
      - label: About
        name: about
        file: content/about/index.md
        fields:
          - label: Title
            name: title
            widget: string
            hint: "The title inside this page's masthead. Do not repeat it as a Heading 1 in Body."
          - label: Description
            name: description
            widget: string
            required: false
            hint: "Optional introduction and description for search and link previews. Leave blank to begin with the portrait and body."
          - label: Portrait
            name: portrait
            widget: image
            required: false
            media_folder: ""
            public_folder: ""
            hint: "Your original photo above the About text. Upload it beside the About page; the site crops it behind the separate Deco frame without regenerating your face."
          - label: Portrait Deco frame
            name: portraitFrame
            widget: image
            required: false
            media_folder: ""
            public_folder: ""
            hint: "Transparent decorative overlay, separate from your photo. Keep portrait-frame-v2.png for the current rose and arch design. Clear this field to display a plain photo."
          - label: Portrait alt text
            name: portraitAlt
            widget: string
            required: false
            hint: "Describe the portrait for readers who cannot see it. This is not a visible caption."
          - label: Body
            name: body
            widget: markdown
            modes: [rich_text, raw]
            editor_components: [image, code-block, pullquote, aside, ornament, diamond, figure]
            hint: "Write the About text here. The same Markdown, + menu blocks, framed images, and footnotes work here as in columns. Open Writing guide for copyable examples."
