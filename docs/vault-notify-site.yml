# Lives in the VAULT repo as .github/workflows/notify-site.yml.
# On every push to main it asks the site repo to rebuild (repository_dispatch: vault-updated).
name: Notify site
on:
  push:
    branches: [main]
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/loganerik/loganeastman.com/dispatches \
            -d '{"event_type":"vault-updated","client_payload":{"sha":"${{ github.sha }}"}}'
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
